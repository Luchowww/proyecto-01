<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Maratón: descubre cuántas horas te toma cada serie y arma tu propia maratón." />
    <title>Maratón · Tu vida en series</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800;100,900;125,800;125,900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Aplica el tema guardado antes de pintar para evitar el parpadeo claro/oscuro -->
    <script>
      try {
        if (localStorage.getItem('maraton-theme') === 'light') {
          document.documentElement.classList.remove('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
